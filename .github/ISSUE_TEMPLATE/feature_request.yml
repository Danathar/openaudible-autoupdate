name: Feature request
description: Propose a change to what the updater does
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is not possible or inconvenient today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Include any new env vars, units, or manifest fields involved.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Script (openaudible-autoupdate.sh)
        - systemd units
        - Packaging format (e.g. deb) / platform key
        - Docs
        - Tests / CI
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This does not weaken the sha256 verification before install
          required: true
